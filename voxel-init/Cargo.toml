[package]
name = "voxel-init"
version = "0.1.0"
edition = "2021"

# The in-guest bring-up agent baked into voxel images. Deliberately depends on
# NOTHING illumos-/falcon-specific so it cross-compiles to both guest OSes:
# illumos (the voxel-cp gimlet) and x86_64-unknown-linux-musl (the voxel-frr
# router). All OS interaction is shelling out to commands, so the same source
# builds for both targets; only the role chosen at runtime differs.

[[bin]]
name = "voxel-init"
path = "src/main.rs"

# Concrete deps (not workspace-inherited) so this crate builds standalone in the
# `voxel-helpers` bundle the builder guest downloads + compiles. Keep versions in
# sync with the root workspace.
[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
toml_edit = "0.25"
libc = "0.2"
