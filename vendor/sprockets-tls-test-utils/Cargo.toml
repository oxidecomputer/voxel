[package]
name = "sprockets-tls-test-utils"
version = "0.1.0"
edition = "2021"

# Vendored copy of oxidecomputer/sprockets tls/test-utils @ d2b68e4, patched so
# the generated trust-quorum cert platform-id serial matches voxel's SP VPD +
# SMBIOS baseboard serial (BRM4422000N) -- see the [patch] in the workspace root.
[dependencies]
camino = { version = "1.2.2", features = ["serde1"] }
pki-playground = { git = "https://github.com/oxidecomputer/pki-playground", rev = "7600756029ce046a02c6234aa84ce230cc5eaa04" }
