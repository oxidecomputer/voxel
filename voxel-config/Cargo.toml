[package]
name = "voxel-config"
version = "0.1.0"
edition = "2024"

# Pure-Rust topology config generation for Voxel (no libfalcon) - builds and
# tests on any host, including macOS.

[dependencies]
oxnet.workspace = true
serde = { workspace = true, features = ["derive"] }
toml = "0.9"
toml_edit = { workspace = true }

[dev-dependencies]
expectorate.workspace = true
