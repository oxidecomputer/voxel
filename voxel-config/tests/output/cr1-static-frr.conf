frr defaults datacenter
hostname cr1
!
interface enp0s8
 description to ce
!
interface enp0s9
 ip address 198.51.101.1/30
!
router bgp 65101
 no bgp ebgp-requires-policy
 neighbor enp0s8 interface remote-as external
 neighbor enp0s8 timers connect 1
 neighbor 198.51.101.2 remote-as 65000
 neighbor 198.51.101.2 timers connect 1
 !
 address-family ipv4 unicast
  redistribute static
  neighbor enp0s8 activate
  neighbor 198.51.101.2 activate
 exit-address-family
!
ip route 198.51.100.0/24 198.51.101.2
