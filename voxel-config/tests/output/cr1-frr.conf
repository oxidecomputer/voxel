frr defaults datacenter
hostname cr1
!
interface enp0s9
 description to switch0
!
interface enp0s10
 description to switch1
!
interface enp0s8
 description to ce
!
router bgp 65101
 no bgp ebgp-requires-policy
 neighbor enp0s9 interface remote-as external
 neighbor enp0s9 timers connect 1
 neighbor enp0s10 interface remote-as external
 neighbor enp0s10 timers connect 1
 neighbor enp0s8 interface remote-as external
 neighbor enp0s8 timers connect 1
 !
 address-family ipv4 unicast
  neighbor enp0s9 activate
  neighbor enp0s10 activate
  neighbor enp0s8 activate
 exit-address-family
 !
 address-family ipv6 unicast
  neighbor enp0s9 activate
  neighbor enp0s10 activate
  neighbor enp0s8 activate
 exit-address-family
!
