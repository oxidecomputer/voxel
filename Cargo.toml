[workspace]
resolver = "2"

members = [
    "voxel-config",
    "voxel",
    "voxel-init",
]

[workspace.dependencies]
anyhow = "1.0.102"
# The omicron commit voxel is pinned to. Bumping this rev is the new-omicron
# motion; build.rs surfaces it to voxel image create. Keep both revs identical.
rack-init-config = { git = "https://github.com/oxidecomputer/omicron", rev = "2e55f4ddac2fe51fc37e9a70e0619a013509750f" }
wicketd-commission-types-versions = { git = "https://github.com/oxidecomputer/omicron", rev = "2e55f4ddac2fe51fc37e9a70e0619a013509750f" }
wicketd-commission-client = { git = "https://github.com/oxidecomputer/omicron", rev = "2e55f4ddac2fe51fc37e9a70e0619a013509750f" }
clap = { version = "4.6.1", features = ["derive", "env"] }
expectorate = "1.2.0"
# Our crates use only #[tokio::main] + tokio::time; libfalcon pulls its own
# tokio features (they're additive), so we don't need "full".
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "time"] }
libfalcon = { git = "https://github.com/oxidecomputer/falcon", branch = "main" }
# Must be the rev libfalcon pins, so instance-spec component types unify.
propolis-client = { git = "https://github.com/oxidecomputer/propolis", rev = "36f20be9bb4c3b362029237f5feb6377c982395f" }
futures = "0.3"
oxnet = "0.1"
slog = "2.7"
serde = "1"
camino = { version = "1.2.2", features = ["serde1"] }
indoc = "2.0.7"
toml_edit = "0.25"

# sprockets/trust quorum related deps
attest-mock = { git = "https://github.com/oxidecomputer/dice-util", rev = "4a39ef08d81e5177edee0bddb1146032aa21074d" }
sprockets-tls-test-utils = { git = "https://github.com/oxidecomputer/sprockets.git", rev = "a233079e04d9688454486c452b694587a28c5257" }
