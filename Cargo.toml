[workspace]
resolver = "2"

members = [
    "voxel-config",
    "voxel",
    "voxel-init",
    "xtask",
]

[workspace.dependencies]
anyhow = "1.0.102"
# The omicron commit voxel is pinned to. Bumping this rev is the new-omicron
# motion; build.rs surfaces it to voxel image create. Keep all revs identical
# (except voxel's `commtest`, see voxel/Cargo.toml).
rack-init-config = { git = "https://github.com/oxidecomputer/omicron", rev = "dce8d982923f37fd912fd0b22594eddd6447cf61" }
wicketd-commission-types-versions = { git = "https://github.com/oxidecomputer/omicron", rev = "dce8d982923f37fd912fd0b22594eddd6447cf61" }
wicketd-commission-client = { git = "https://github.com/oxidecomputer/omicron", rev = "dce8d982923f37fd912fd0b22594eddd6447cf61" }
# Unnumbered BGP peer type rack-init-config does not re-export yet.
sled-agent-types = { git = "https://github.com/oxidecomputer/omicron", rev = "dce8d982923f37fd912fd0b22594eddd6447cf61" }
clap = { version = "4.6.1", features = ["derive", "env"] }
expectorate = "1.2.0"
# Our crates use only #[tokio::main] + tokio::time; libfalcon pulls its own
# tokio features (they're additive), so we don't need "full".
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "time"] }
libfalcon = { git = "https://github.com/oxidecomputer/falcon", rev = "826830f679f4d754882c0c057a4c75b7f4045daf" }
# Must be the rev libfalcon pins, so instance-spec component types unify.
propolis-client = { git = "https://github.com/oxidecomputer/propolis", rev = "12b00ba88d088e0c61b2d4d26f765fc83f6a76b8" }
futures = "0.3"
oxnet = "0.1"
slog = "2.7"
serde = "1"
camino = { version = "1.2.2", features = ["serde1"] }
indoc = "2.0.7"
itertools = "0.14.0"
toml_edit = "0.25"
camino-tempfile = "1.4.1"

# sprockets/trust quorum related deps
attest-mock = { git = "https://github.com/oxidecomputer/dice-util", rev = "4a39ef08d81e5177edee0bddb1146032aa21074d" }
sprockets-tls-test-utils = { git = "https://github.com/oxidecomputer/sprockets.git", rev = "a233079e04d9688454486c452b694587a28c5257" }
