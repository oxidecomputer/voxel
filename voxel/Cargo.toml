[package]
name = "voxel"
version = "0.1.0"
edition = "2024"

# The Voxel topology tool: launches an image-backed virtual rack and applies
# on-the-fly generated config. libfalcon -> builds/runs on Helios only.

[[bin]]
name = "voxel"
path = "src/main.rs"

[dependencies]
tokio.workspace = true
tokio-util.workspace = true
ratatui.workspace = true
crossterm.workspace = true
base64.workspace = true
libfalcon.workspace = true
propolis-client.workspace = true
anyhow.workspace = true
slog.workspace = true
futures.workspace = true
clap.workspace = true
camino.workspace = true
indoc.workspace = true
oxnet.workspace = true
voxel-config = { path = "../voxel-config" }
# Omicron's own RackInitializeRequest types and config-rss serialization,
# pinned to the omicron commit voxel targets.
rack-init-config.workspace = true
wicketd-commission-types-versions.workspace = true
wicketd-commission-client.workspace = true
# Reshape the generated config-rss.toml into wicketd's RSS config JSON for
# `launch --wicket-setup` (drive setup through wicketd).
toml = "0.9"
serde_json = "1"
serde = { workspace = true, features = ["derive"] }
# Unpack TUF control-plane composites (GNU tar format; illumos tar rejects it).
tar = "0.4"
flate2 = "1"
libc = "0.2"
reqwest.workspace = true
chrono = { version = "0.4", features = ["serde"] }

# Sprockets/trust-quorum test keys - generated at launch (replaces a4x2's
# pre-generated per-sled sprockets material that prep.sh used to rsync in).
attest-mock.workspace = true
sprockets-tls-test-utils.workspace = true
